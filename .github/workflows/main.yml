name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Manual trigger ke liye

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Gradle dependencies ko cache karein taaki builds fast ho
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Lint check - code quality ke liye (Agar error aaye toh fail nahi hoga)
      - name: Run Lint
        run: ./gradlew lintDebug || true

      # Unit tests chalayein
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest || true

      # Debug APK build karein
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # APK ko artifact ke roop mein upload karein taaki download kar sakein
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
