name: Publish JARVIS Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read release version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') { throw "Invalid release tag: $env:GITHUB_REF_NAME" }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install desktop dependencies
        run: python -m pip install -r desktop/windows/requirements.txt

      - name: Build standalone Windows executable
        working-directory: desktop/windows
        run: pyinstaller --noconfirm --clean --onefile --windowed --collect-all pystray --collect-all PIL --collect-all vosk --collect-all pypdf --name JARVIS jarvis_desktop.py

      - name: Create Windows installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.5
        with:
          path: desktop/windows/installer/JARVIS.iss
          options: /O+ /DMyAppVersion=${{ env.APP_VERSION }}

      - name: Create SHA-256 checksums
        shell: pwsh
        run: |
          $files = @(
            "desktop/windows/dist/JARVIS.exe",
            "desktop/windows/dist-installer/JARVIS-Setup-x64.exe"
          )
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLower()
            "$hash  $([System.IO.Path]::GetFileName($file))"
          }
          $lines | Out-File -FilePath SHA256SUMS.txt -Encoding ascii

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            desktop/windows/dist/JARVIS.exe
            desktop/windows/dist-installer/JARVIS-Setup-x64.exe
            SHA256SUMS.txt
