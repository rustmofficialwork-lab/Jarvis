name: Windows Desktop Checks

on:
  pull_request:
    branches: [main, feat/offline-wake-word]
    paths:
      - "desktop/windows/**"
      - ".github/workflows/windows-desktop.yml"
  push:
    branches: [main, feat/offline-wake-word, feat/windows-desktop-app]
    paths:
      - "desktop/windows/**"
      - ".github/workflows/windows-desktop.yml"

jobs:
  source-checks:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python source
        run: python -m compileall -q desktop/windows
      - name: Install PDF parser for document tests
        run: python -m pip install pypdf
      - name: Run desktop unit tests
        run: python -m unittest discover -s desktop/windows -p "test_*.py"

  package-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install desktop dependencies
        run: python -m pip install -r desktop/windows/requirements.txt
      - name: Build standalone Windows executable
        working-directory: desktop/windows
        run: pyinstaller --noconfirm --clean --onefile --windowed --collect-all pystray --collect-all PIL --collect-all vosk --collect-all pypdf --name JARVIS jarvis_desktop.py
      - name: Upload JARVIS Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows-Portable-x64
          path: desktop/windows/dist/JARVIS.exe
          if-no-files-found: error

      - name: Create Windows installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.5
        with:
          path: desktop/windows/installer/JARVIS.iss
          options: /O+ /DMyAppVersion=1.0.0

      - name: Upload JARVIS Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows-Installer-x64
          path: desktop/windows/dist-installer/JARVIS-Setup-x64.exe
          if-no-files-found: error
