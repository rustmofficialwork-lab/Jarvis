name: JARVIS Project Checks and Windows Build

on:
  push:
    branches: [main]
    paths:
      - "desktop/windows/**"
      - "src/**"
      - "tests/**"
      - "installer/windows/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "vite.config.ts"
      - "vitest.config.ts"
      - "tsconfig.json"
      - "eslint.config.js"
      - "README.md"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "desktop/windows/**"
      - "src/**"
      - "tests/**"
      - "installer/windows/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "vite.config.ts"
      - "vitest.config.ts"
      - "tsconfig.json"
      - "eslint.config.js"
      - "README.md"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    name: Windows desktop and source checks
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Compile desktop and test sources
        run: python -m compileall -q desktop/windows tests/desktop
      - name: Install desktop runtime dependencies
        run: python -m pip install -r desktop/windows/requirements.txt
      - name: Run desktop unit tests
        env:
          PYTHONPATH: desktop/windows
        run: python -m unittest discover -s tests/desktop -p "test_*.py" -v
      - name: Test HUD gesture logic
        run: node --test tests/desktop/test_jarvis_gesture_logic.cjs


  web-checks:
    name: Web dashboard checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked web dependencies
        run: bun install --frozen-lockfile
      - name: Lint web application
        run: bun run lint
      - name: Run web tests
        run: bun run test
      - name: Build web application
        run: bun run build

  package-windows:
    name: Build Windows desktop installer
    needs: [source-checks, web-checks]
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Set up Node.js for bundled HUD runtimes
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install desktop dependencies
        run: python -m pip install -r desktop/windows/requirements.txt
      - name: Bundle offline Hindi and English speech models
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bundle = Join-Path $PWD "desktop/windows/offline-speech-bundle"
          New-Item -ItemType Directory -Force -Path $bundle | Out-Null
          $models = @(
            @{ Name = "vosk-model-small-hi-0.22"; Url = "https://alphacephei.com/vosk/models/vosk-model-small-hi-0.22.zip"; MinimumBytes = 25000000 },
            @{ Name = "vosk-model-small-en-in-0.4"; Url = "https://alphacephei.com/vosk/models/vosk-model-small-en-in-0.4.zip"; MinimumBytes = 20000000 },
            @{ Name = "vosk-model-small-en-us-0.15"; Url = "https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip"; MinimumBytes = 25000000 }
          )
          foreach ($model in $models) {
            $archive = Join-Path $env:RUNNER_TEMP ($model.Name + ".zip")
            Invoke-WebRequest -Uri $model.Url -OutFile $archive
            if ((Get-Item -LiteralPath $archive).Length -lt $model.MinimumBytes) { throw "Speech model archive is too small or incomplete: $($model.Name)." }
            Expand-Archive -LiteralPath $archive -DestinationPath $bundle -Force
            Remove-Item -LiteralPath $archive -Force
            $modelDir = Join-Path $bundle $model.Name
            if (-not (Test-Path (Join-Path $modelDir "conf/model.conf")) -or -not (Test-Path (Join-Path $modelDir "am/final.mdl"))) {
              throw "Speech model structure is incomplete: $($model.Name)."
            }
          }
          Invoke-WebRequest -Uri "https://www.apache.org/licenses/LICENSE-2.0.txt" -OutFile (Join-Path $bundle "VOSK-MODELS-APACHE-2.0.txt")
          @(
            "Bundled Vosk small models supplied by Alpha Cephei.",
            "Models: Hindi hi-0.22, Indian English en-in-0.4, US English en-us-0.15.",
            "Each model is listed as Apache License 2.0 on https://alphacephei.com/vosk/models.",
            "The Vosk model license text is included as VOSK-MODELS-APACHE-2.0.txt."
          ) | Set-Content -Path (Join-Path $bundle "README.txt") -Encoding utf8
          Write-Host "Bundled all three offline speech models."

      - name: Bundle offline owner-voice encoder
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $revision = "4467ef1f92829ca0ff4bbdaa70d31f7d7d25c12c"
          $bundle = Join-Path $PWD "desktop/windows/offline-voice-bundle/speaker_model"
          New-Item -ItemType Directory -Force -Path $bundle | Out-Null
          $base = "https://huggingface.co/kenrunio/transcriber-speaker-onnx/resolve/$revision"
          $model = Join-Path $bundle "ecapa-any-length.onnx"
          Invoke-WebRequest -Uri "$base/ecapa-any-length.onnx" -OutFile $model
          $hash = (Get-FileHash -LiteralPath $model -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "700b63064ee98981186f59f247d28e56f7f6ab265d8b50ebb450db5a8ce21dc7") { throw "The bundled owner-voice encoder failed SHA-256 verification." }
          Invoke-WebRequest -Uri "$base/LICENSE" -OutFile (Join-Path $bundle "LICENSE")
          if ((Get-Item -LiteralPath (Join-Path $bundle "LICENSE")).Length -lt 100) { throw "The owner-voice model license file is missing or incomplete." }
          Write-Host "Bundled the pinned Apache-2.0 ECAPA model; the user's voice profile is still created locally during explicit enrollment."

      - name: Verify offline voice bundle contents
        shell: pwsh
        run: |
          $speech = Join-Path $PWD "desktop/windows/offline-speech-bundle"
          foreach ($name in @("vosk-model-small-hi-0.22", "vosk-model-small-en-in-0.4", "vosk-model-small-en-us-0.15")) {
            $model = Join-Path $speech $name
            if (-not (Test-Path (Join-Path $model "conf/model.conf")) -or -not (Test-Path (Join-Path $model "am/final.mdl"))) { throw "Offline speech model is missing or incomplete: $name." }
          }
          if (-not (Test-Path (Join-Path $speech "VOSK-MODELS-APACHE-2.0.txt"))) { throw "Vosk model license notice is missing." }
          $speaker = Join-Path $PWD "desktop/windows/offline-voice-bundle/speaker_model/ecapa-any-length.onnx"
          if (-not (Test-Path $speaker)) { throw "Offline owner-voice encoder is missing." }
          $hash = (Get-FileHash -LiteralPath $speaker -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "700b63064ee98981186f59f247d28e56f7f6ab265d8b50ebb450db5a8ce21dc7") { throw "Offline owner-voice encoder checksum mismatch." }
          if (-not (Test-Path (Join-Path (Split-Path $speaker) "LICENSE"))) { throw "Offline owner-voice model license is missing." }
          Write-Host "All offline voice assets and license notices verified."

      - name: Bundle pinned HUD runtime libraries
        shell: pwsh
        run: |
          $vendor = Join-Path $PWD "desktop/windows/vendor"
          $threeTemp = Join-Path $env:RUNNER_TEMP "jarvis-three"
          $visionTemp = Join-Path $env:RUNNER_TEMP "jarvis-vision"
          New-Item -ItemType Directory -Force -Path $vendor, $threeTemp, $visionTemp | Out-Null

          $threeArchive = npm pack three@0.160.0 --pack-destination $env:RUNNER_TEMP --silent | Select-Object -Last 1
          if ($LASTEXITCODE -ne 0 -or -not $threeArchive) { throw "Could not download the pinned Three.js package." }
          tar -xf (Join-Path $env:RUNNER_TEMP $threeArchive) -C $threeTemp
          Copy-Item (Join-Path $threeTemp "package/build/three.module.js") (Join-Path $vendor "three.module.js") -Force

          $licenseDir = Join-Path $vendor "licenses"
          New-Item -ItemType Directory -Force -Path $licenseDir | Out-Null
          Copy-Item (Join-Path $threeTemp "package/LICENSE") (Join-Path $licenseDir "THREE-MIT.txt") -Force

          $visionArchive = npm pack @mediapipe/tasks-vision@0.10.14 --pack-destination $env:RUNNER_TEMP --silent | Select-Object -Last 1
          if ($LASTEXITCODE -ne 0 -or -not $visionArchive) { throw "Could not download the pinned MediaPipe package." }
          tar -xf (Join-Path $env:RUNNER_TEMP $visionArchive) -C $visionTemp
          $visionVendor = Join-Path $vendor "mediapipe"
          New-Item -ItemType Directory -Force -Path $visionVendor | Out-Null
          Copy-Item (Join-Path $visionTemp "package/vision_bundle.mjs") (Join-Path $visionVendor "vision_bundle.mjs") -Force
          Copy-Item (Join-Path $visionTemp "package/wasm") (Join-Path $visionVendor "wasm") -Recurse -Force
          $modelDir = Join-Path $visionVendor "models"
          New-Item -ItemType Directory -Force -Path $modelDir | Out-Null
          Invoke-WebRequest -Uri "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task" -OutFile (Join-Path $modelDir "hand_landmarker.task")
          if ((Get-Item (Join-Path $modelDir "hand_landmarker.task")).Length -lt 1000000) { throw "The MediaPipe hand-landmarker model download is missing or incomplete." }
          Invoke-WebRequest -Uri "https://www.apache.org/licenses/LICENSE-2.0.txt" -OutFile (Join-Path $licenseDir "APACHE-2.0.txt")
          Copy-Item "docs/legal/THIRD_PARTY_NOTICES.md" (Join-Path $vendor "THIRD_PARTY_NOTICES.md") -Force

          if (-not (Test-Path (Join-Path $vendor "three.module.js")) -or
              -not (Test-Path (Join-Path $visionVendor "vision_bundle.mjs")) -or
              -not (Test-Path (Join-Path $visionVendor "wasm")) -or
              -not (Test-Path (Join-Path $modelDir "hand_landmarker.task"))) {
            throw "One or more bundled HUD runtime or hand-landmarker model assets are missing."
          }
      - name: Bundle Qwen3.5 4B and offline Ollama runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bundle = Join-Path $PWD "desktop/windows/offline-ai-bundle"
          $modelRoot = Join-Path $bundle "models"
          $blobRoot = Join-Path $modelRoot "blobs"
          $manifestRoot = Join-Path $modelRoot "manifests/registry.ollama.ai/library/qwen3.5"
          New-Item -ItemType Directory -Force -Path $blobRoot, $manifestRoot | Out-Null
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/rustmofficialwork-lab/Jarvis/releases/tags/offline-ai-qwen3.5-4b" -Headers @{ "User-Agent" = "JARVIS-Windows-Build"; "Accept" = "application/vnd.github+json" }
          $assets = @{}
          foreach ($asset in $release.assets) { $assets[$asset.name] = $asset }
          foreach ($required in @("qwen35-index.json", "qwen35-manifest.json")) {
            if (-not $assets.ContainsKey($required)) { throw "Offline model release is missing $required." }
          }
          $temp = Join-Path $env:RUNNER_TEMP "jarvis-qwen-bundle"
          New-Item -ItemType Directory -Force -Path $temp | Out-Null
          $indexPath = Join-Path $temp "qwen35-index.json"
          $manifestPath = Join-Path $temp "qwen35-manifest.json"
          Invoke-WebRequest -Uri $assets["qwen35-index.json"].browser_download_url -OutFile $indexPath
          Invoke-WebRequest -Uri $assets["qwen35-manifest.json"].browser_download_url -OutFile $manifestPath
          $index = Get-Content -LiteralPath $indexPath -Raw | ConvertFrom-Json
          if ($index.model -ne "qwen3.5:4b" -or -not $index.blobs) { throw "Offline model index is invalid or names the wrong model." }
          foreach ($blob in $index.blobs) {
            if (-not ([string]$blob.digest).StartsWith("sha256:") -or ([string]$blob.digest).Length -ne 71 -or [long]$blob.size -le 0) {
              throw "Offline model index contains an invalid blob entry."
            }
            $blobName = ([string]$blob.digest).Replace(":", "-")
            # Older index exports may list only part001. Discover all chunks from
            # release assets and sort by their numeric suffix before concatenating.
            $partPrefix = "qwen35-$blobName-part"
            $partNames = @($assets.Keys | Where-Object { $_.StartsWith($partPrefix) -and $_.EndsWith(".bin") } | Sort-Object { [int]($_.Substring($partPrefix.Length, $_.Length - $partPrefix.Length - 4)) })
            if ($partNames.Count -eq 0) { throw "Offline model release has no chunks for $blobName." }
            $partBytes = [long](($partNames | ForEach-Object { [long]$assets[$_].size } | Measure-Object -Sum).Sum)
            if ($partBytes -ne [long]$blob.size) { throw "Model chunk sizes do not match $blobName (expected $($blob.size), got $partBytes across $($partNames.Count) chunks)." }
            $assembled = Join-Path $temp ($blobName + ".assembled")
            $stream = [IO.File]::Create($assembled)
            try {
              foreach ($part in $partNames) {
                if (-not $assets.ContainsKey([string]$part)) { throw "Offline model release is missing part $part." }
                $partPath = Join-Path $temp ([string]$part)
                $partAsset = $assets[[string]$part]
                Invoke-WebRequest -Uri $partAsset.browser_download_url -OutFile $partPath
                $actualPartBytes = (Get-Item -LiteralPath $partPath).Length
                if ($actualPartBytes -ne [long]$partAsset.size) {
                  throw "Downloaded model part has an incorrect size: $part (expected $($partAsset.size), got $actualPartBytes)."
                }
                $partStream = [IO.File]::OpenRead($partPath)
                try { $partStream.CopyTo($stream) } finally { $partStream.Dispose(); Remove-Item -LiteralPath $partPath -Force }
              }
            } finally { $stream.Dispose() }
            $assembledBytes = (Get-Item -LiteralPath $assembled).Length
            if ($assembledBytes -ne [long]$blob.size) {
              throw "Assembled model blob has an incorrect size: $blobName (expected $($blob.size), got $assembledBytes)."
            }
            $hash = (Get-FileHash -LiteralPath $assembled -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -ne ([string]$blob.digest).Substring(7)) { throw "Assembled model blob failed SHA-256 verification: $blobName." }
            Move-Item -LiteralPath $assembled -Destination (Join-Path $blobRoot $blobName) -Force
          }
          Copy-Item -LiteralPath $manifestPath -Destination (Join-Path $manifestRoot "4b") -Force
          $ollamaZip = Join-Path $temp "ollama-windows-amd64.zip"
          Invoke-WebRequest -Uri "https://ollama.com/download/ollama-windows-amd64.zip" -OutFile $ollamaZip
          $ollamaDir = Join-Path $bundle "ollama"
          New-Item -ItemType Directory -Force -Path $ollamaDir | Out-Null
          Expand-Archive -LiteralPath $ollamaZip -DestinationPath $ollamaDir -Force
          if (-not (Get-ChildItem -Path $ollamaDir -Filter "ollama.exe" -Recurse | Select-Object -First 1)) {
            throw "Bundled Ollama runtime archive did not contain ollama.exe."
          }
          Write-Host "Bundled Qwen3.5 4B and Ollama runtime into the offline installer."
          $modelBytes = (Get-ChildItem -Path $modelRoot -Recurse -File | Measure-Object -Property Length -Sum).Sum
          Write-Host "Bundled model bytes: $modelBytes"
      - name: Set application build version
        shell: pwsh
        run: |
          $version = "1.1.$env:GITHUB_RUN_NUMBER"
          Set-Content -Path "desktop/windows/build_version.py" -Value ('APP_VERSION = "' + $version + '"') -Encoding utf8
          python -c "import runpy; assert runpy.run_path('desktop/windows/build_version.py')['APP_VERSION'] == '$version'"
      - name: Build standalone Windows executable
        working-directory: desktop/windows
        run: pyinstaller --noconfirm --onedir --windowed --add-data "jarvis_hud.html;." --add-data "jarvis_hud_extensions.js;." --add-data "jarvis_hud_runtime.js;." --add-data "jarvis_gesture_logic.js;." --add-data "vendor;vendor" --collect-all webview --collect-all proxy_tools --collect-all pystray --collect-all PIL --collect-all vosk --collect-all openwakeword --collect-all onnxruntime --exclude-module android --exclude-module onnxruntime.quantization --collect-all huggingface_hub --collect-all playwright --collect-all greenlet --paths . --hidden-import browser_automation --hidden-import build_version --hidden-import owner_voice_setup --hidden-import owner_voice_verification --name JARVIS jarvis_desktop.py
      - name: Smoke-test packaged Windows executable
        shell: pwsh
        run: |
          $executable = Join-Path $PWD "desktop/windows/dist/JARVIS/JARVIS.exe"
          if (-not (Test-Path $executable)) { throw "Packaged JARVIS.exe was not created." }
          $stdout = Join-Path $env:RUNNER_TEMP "jarvis-version.stdout.txt"
          $stderr = Join-Path $env:RUNNER_TEMP "jarvis-version.stderr.txt"
          $process = Start-Process -FilePath $executable -ArgumentList "--version" -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (-not $process.WaitForExit(90000)) {
            $process.Kill()
            $process.WaitForExit()
            throw "Packaged JARVIS.exe did not exit within 90 seconds during its version smoke test."
          }
          $reportedVersion = if (Test-Path $stdout) { (Get-Content $stdout -Raw).Trim() } else { "" }
          if ($process.ExitCode -ne 0) {
            $errorOutput = if (Test-Path $stderr) { Get-Content $stderr -Raw } else { "No stderr output." }
            throw "Packaged JARVIS.exe exited with code $($process.ExitCode): $errorOutput"
          }
          $expectedVersion = "1.1.$env:GITHUB_RUN_NUMBER"
          if ($reportedVersion -ne $expectedVersion) {
            throw "Packaged executable reported '$reportedVersion'; expected '$expectedVersion'."
          }
          Write-Host "Packaged JARVIS executable started successfully: $reportedVersion"
      - name: Build Windows installer
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          )
          $compiler = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $compiler) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed." }
            $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $compiler)) { throw "ISCC.exe was not found after installation." }
          New-Item -ItemType Directory -Force -Path "dist-installer" | Out-Null
          & $compiler "/DMyAppVersion=1.1.$env:GITHUB_RUN_NUMBER" "installer/windows/JARVIS.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload complete offline JARVIS installer
        uses: actions/upload-artifact@v6
        with:
          name: JARVIS-Full-Offline-Setup
          path: dist-installer/JARVIS-Setup-x64.exe
          if-no-files-found: error
          retention-days: 90
