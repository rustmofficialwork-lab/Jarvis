name: Windows Desktop Checks

on:
  pull_request:
    branches: [main, feat/offline-wake-word]
    paths:
      - "desktop/windows/**"
      - ".github/workflows/windows-desktop.yml"
  push:
    branches: [main, feat/offline-wake-word, feat/windows-desktop-app]
    paths:
      - "desktop/windows/**"
      - ".github/workflows/windows-desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Compile Python source
        run: python -m compileall -q desktop/windows
      - name: Install PDF parser for document tests
        run: python -m pip install pypdf
      - name: Run desktop unit tests
        run: python -m unittest discover -s desktop/windows -p "test_*.py"

  package-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install desktop dependencies
        run: python -m pip install -r desktop/windows/requirements.txt
      - name: Build standalone Windows executable
        working-directory: desktop/windows
        run: pyinstaller --noconfirm --clean --onefile --windowed --collect-all pystray --collect-all PIL --collect-all vosk --collect-all pypdf --name JARVIS jarvis_desktop.py
      - name: Upload JARVIS Windows executable
        uses: actions/upload-artifact@v7
        with:
          name: JARVIS-Windows-Portable-x64
          path: desktop/windows/dist/JARVIS.exe
          if-no-files-found: error

      - name: Build Windows installer
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          )
          $compiler = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $compiler) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed." }
            $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $compiler)) { throw "ISCC.exe was not found after installation." }
          & $compiler /O+ /DMyAppVersion=1.1.0 desktop/windows/installer/JARVIS.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload JARVIS Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: JARVIS-Windows-Installer-x64
          path: desktop/windows/dist-installer/JARVIS-Setup-x64.exe
          if-no-files-found: error

      # Publish stable, direct download links for Windows users. GitHub's
      # Actions artifact table UI varies by viewport; release assets are easier
      # to find and can be downloaded without opening the artifact details.
      - name: Publish latest Windows downloads
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: jarvis-latest
          target_commitish: main
          name: JARVIS Latest Windows Build
          body: |
            Latest successful Windows desktop build from the main branch.

            - Installer: JARVIS-Setup-x64.exe
            - Portable executable: JARVIS.exe

            These links are updated by the Windows Desktop workflow.
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            desktop/windows/dist-installer/JARVIS-Setup-x64.exe
            desktop/windows/dist/JARVIS.exe
