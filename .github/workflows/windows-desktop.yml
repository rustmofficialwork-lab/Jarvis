name: Windows Desktop Checks

on:
  pull_request:
    branches: [main, feat/offline-wake-word, feature/complete-realtime-dashboard]
    paths:
      - "desktop/windows/**"
      - ".github/workflows/windows-desktop.yml"
  push:
    branches: [main, feat/offline-wake-word, feat/windows-desktop-app, feat/jarvis-live-holographic-dashboard, feature/complete-realtime-dashboard]
    paths:
      - "desktop/windows/**"
      - ".github/workflows/windows-desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

# Only the newest main-branch build may publish the rolling latest release.
concurrency:
  group: jarvis-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Compile Python source
        run: python -m compileall -q desktop/windows
      - name: Install PDF parser for document tests
        run: python -m pip install pypdf Pillow
      - name: Run desktop unit tests
        run: python -m unittest discover -s desktop/windows -p "test_*.py"

  package-windows:
    needs: source-checks
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Set build version
        shell: pwsh
        run: |
          $version = "1.1.$env:GITHUB_RUN_NUMBER"
          "JARVIS_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "JARVIS_BUILD_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "APP_VERSION = `"$version`"" | Set-Content -Path desktop/windows/build_version.py -Encoding utf8
      - name: Install desktop dependencies
        run: python -m pip install -r desktop/windows/requirements.txt
      - name: Build standalone Windows executable
        working-directory: desktop/windows
        run: pyinstaller --noconfirm --clean --onefile --windowed --add-data "jarvis_hud.html;." --collect-all webview --collect-all bottle --collect-all proxy_tools --collect-all pystray --collect-all PIL --collect-all vosk --collect-all pypdf --name JARVIS jarvis_desktop.py
      - name: Upload JARVIS Windows executable
        uses: actions/upload-artifact@v7
        with:
          name: JARVIS-Windows-Portable-x64
          path: desktop/windows/dist/JARVIS.exe
          if-no-files-found: error

      - name: Build Windows installer
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          )
          $compiler = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $compiler) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed." }
            $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $compiler)) { throw "ISCC.exe was not found after installation." }
          & $compiler /O+ "/DMyAppVersion=$env:JARVIS_VERSION" desktop/windows/installer/JARVIS.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload JARVIS Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: JARVIS-Windows-Installer-x64
          path: desktop/windows/dist-installer/JARVIS-Setup-x64.exe
          if-no-files-found: error

      - name: Create SHA-256 checksums
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $files = @(
            "desktop/windows/dist/JARVIS.exe",
            "desktop/windows/dist-installer/JARVIS-Setup-x64.exe"
          )
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLower()
            "$hash  $([System.IO.Path]::GetFileName($file))"
          }
          $lines | Out-File -FilePath SHA256SUMS.txt -Encoding ascii

      - name: Publish latest Windows downloads
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: jarvis-latest
          target_commitish: main
          name: JARVIS Latest Windows Build
          body: |
            Latest successful Windows desktop build from the main branch.
            Version: ${{ env.JARVIS_VERSION }}
            Installer: JARVIS-Setup-x64.exe
            Portable executable: JARVIS.exe
            The release is updated by the Windows Desktop workflow.
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            desktop/windows/dist-installer/JARVIS-Setup-x64.exe
            desktop/windows/dist/JARVIS.exe
            SHA256SUMS.txt
