name: Check Project Structure

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-structure:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Inspect project files
        run: |
          echo "=== Root files ==="
          ls -la

          echo "=== Gradle wrapper ==="
          ls -la gradle/wrapper || true

          echo "=== App files ==="
          ls -la app || true

          echo "=== Source files ==="
          find app/src -maxdepth 6 -type f \
            2>/dev/null | sort || true

      - name: Verify required files
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f gradle/wrapper/gradle-wrapper.properties

          echo "Required Gradle files found."
