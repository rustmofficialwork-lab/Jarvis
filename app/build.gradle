plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def picovoiceAccessKey = project.findProperty('PICOVOICE_ACCESS_KEY') ?: System.getenv('PICOVOICE_ACCESS_KEY') ?: ''

android {
    namespace 'com.jarvisassistant.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.jarvisassistant.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "5.0.0"
        // Set PICOVOICE_ACCESS_KEY in user-level ~/.gradle/gradle.properties or the environment.
        // Do not commit the key; if absent, the legacy SpeechRecognizer path remains enabled.
        buildConfigField "String", "PICOVOICE_ACCESS_KEY", "\"${picovoiceAccessKey}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        buildConfig true
        compose true
    }
    
    // 1. Duplicate META-INF files ko pick karne ke liye (Coroutine conflict fix)
    packagingOptions {
        resources {
            pickFirsts += ['META-INF/kotlinx_coroutines_core.version', 'META-INF/AL2.0', 'META-INF/LGPL2.1']
        }
    }
}

// 2. Kotlin version force karne ke liye (Sabse important fix)
configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:2.0.21'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.0.21'
        force 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
        force 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    }
}

dependencies {
    implementation 'ai.picovoice:porcupine-android:4.0.2'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation platform('androidx.compose:compose-bom:2024.09.03')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.material3:material3'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlin:kotlin-test:2.0.21'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
