<style>
:root{--c:#19d3ff;--bg:#000;--g:#2bff3a;color-scheme:dark}
html,body{margin:0;height:100%;background:var(--bg)}
body{display:flex;align-items:center;justify-content:center;overflow:hidden;box-sizing:border-box;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.hide{position:absolute;width:0;height:0}
.scene{width:100%;height:100%;display:block}
.stack{display:none;width:100%}
.stack svg{display:block;width:100%;height:auto}
@media (max-aspect-ratio:1/1){html,body{height:auto;min-height:100%}body{display:block;overflow-x:hidden;overflow-y:auto}.scene{display:none}.stack{display:block}}
text{fill:#f2fdff;text-rendering:geometricPrecision;filter:url(#tg);font-family:Rajdhani,"Segoe UI",Arial,sans-serif;}
text:not([font-size]){font-size:19px}
.t text:not([font-size]),text.t:not([font-size]){font-size:14px}
.s{font-size:15px}.t{font-size:14px}
.l{stroke:var(--c);fill:none;stroke-width:2}
.f{fill:var(--c)}
.cy{fill:var(--c)}
.ic{stroke:var(--c);fill:none;stroke-width:2}
.glow{filter:url(#gl)}
.spin{transform-origin:722px 230px;animation:sp 9s linear infinite}
.pulse{transform-origin:722px 230px;animation:pu 2.6s ease-in-out infinite}
.core{transform-origin:722px 230px;animation:co 2.6s ease-in-out infinite}
.dot{transform-origin:722px 230px;animation:dt 2.6s ease-in-out infinite}
.ring{animation:rg 2.6s ease-in-out infinite}
@keyframes pu{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:.8;transform:scale(1.06)}}
@keyframes co{0%,100%{opacity:.8;transform:scale(1)}50%{opacity:1;transform:scale(1.12)}}
@keyframes dt{0%,100%{transform:scale(.92)}50%{transform:scale(1.15)}}
@keyframes bl{0%,100%{opacity:0}50%{opacity:.5}}
.bl{animation:bl 2.6s ease-in-out infinite}
@keyframes rg{0%,100%{opacity:.75}50%{opacity:1}}
@keyframes sp{to{transform:rotate(360deg)}}
.scene,.stack,.row{animation:boot 1.6s ease-out}
.row{display:none;width:100%;height:100%;justify-content:space-between;align-items:stretch}
.row svg{display:block;height:100%;width:auto;flex:none}
@media (min-aspect-ratio:9/5){.scene{display:none}.row{display:flex}}
.flare{animation:fa 2.6s ease-in-out infinite}
@keyframes fa{0%,100%{opacity:.22}50%{opacity:.6}}
.eyeg{animation:eg 3s ease-in-out infinite}
@keyframes eg{0%,100%{opacity:.12}50%{opacity:.5}}
@keyframes boot{0%{opacity:0}8%{opacity:.5}14%{opacity:.08}24%{opacity:.9}32%{opacity:.35}45%,100%{opacity:1}}
.eq{transform-box:fill-box;transform-origin:center;animation:eqa 1.2s ease-in-out infinite}
@keyframes eqa{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
.scan{animation:sc 3.2s linear infinite}
@keyframes sc{0%{transform:translateY(0);opacity:0}15%,85%{opacity:.9}100%{transform:translateY(270px);opacity:0}}

</style>
</head>

<script>
(function(){
  var D=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],
      M=["january","february","march","april","may","june","july","august","september","october","november","december"];
  function tick(){
    var n=new Date(),h=n.getHours(),m=n.getMinutes(),ap=h>=12?"PM":"AM";
    h=h%12||12;
    document.getElementById("time").textContent=h+":"+(m<10?"0":"")+m+" "+ap;
    document.getElementById("day").textContent=D[n.getDay()];
    document.getElementById("mon").textContent=M[n.getMonth()];
    document.getElementById("dnum").textContent=n.getDate();
  }
  tick();setInterval(tick,15000);
  try{
    if(navigator.getBattery){navigator.getBattery().then(function(b){
      var u=function(){document.getElementById("bat").textContent=Math.round(b.level*100)+"%"};
      u();b.addEventListener("levelchange",u);
    }).catch(function(){});}
  }catch(e){}
})();
</script>
<script>
(function(){
  var $=function(i){return document.getElementById(i)},n=navigator,ua=n.userAgent;
  function set(i,t){var e=$(i);if(e)e.textContent=t}
  var os=/Windows/.test(ua)?"Windows":/Android/.test(ua)?"Android":/iPhone|iPad/.test(ua)?"iOS":/Mac/.test(ua)?"macOS":/Linux/.test(ua)?"Linux":"";
  if(os)set("v-os",os);
  if(/x64|x86_64|Win64|WOW64|arm64|aarch64/i.test(ua))set("v-arch","64-bit");
  if(n.hardwareConcurrency)set("v-cpu",n.hardwareConcurrency+" Cores");

  function net(){set("v-wifi",n.onLine?"Wi-Fi Connected":"Wi-Fi Disconnected");
    var k=n.connection;if(k&&k.downlink)set("v-dl","- DOWNLOAD : "+k.downlink+" Mbps")}

<script>

  function fit(){
    document.querySelectorAll("#m text").forEach(function(t){
      var x=+t.getAttribute("x"),y=+t.getAttribute("y"),mw=0;
      if(y>=550&&y<=672&&x>=640)mw=x<770?766-x:x<925?915-x:1042-x;
